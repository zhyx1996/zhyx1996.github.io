    <script>
      // 外部五子棋 iframe：懒加载 + 加载占位 + 加载失败兜底
      document.querySelectorAll('.nethack-frame-wrap').forEach(function(wrap) {
        var iframe = wrap.querySelector('iframe');
        var loading = wrap.querySelector('.nethack-frame-loading');
        var error = wrap.querySelector('.nethack-frame-error');
        var src = wrap.getAttribute('data-gm-src');
        var loaded = false;
        var timer = null;
        var TIMEOUT = 30000;
        var startTimer = function() {
          if (timer !== null || loaded) return;
          timer = setTimeout(function() {
            if (!loaded) {
              loading.style.display = 'none';
              error.hidden = false;
            }
            timer = null;
          }, TIMEOUT);
        };
        iframe.addEventListener('load', function() {
          loaded = true;
          loading.style.display = 'none';
          error.hidden = true;
        });
        if ('IntersectionObserver' in window) {
          var obs = new IntersectionObserver(function(entries) {
            if (entries[0].isIntersecting) startTimer();
          }, { threshold: 0.05 });
          obs.observe(wrap);
        } else {
          startTimer();
        }
        var retry = wrap.querySelector('.nethack-frame-retry');
        if (retry) retry.addEventListener('click', function() {
          error.hidden = true;
          loading.style.display = '';
          loaded = false;
          iframe.src = src;
          if (timer !== null) { clearTimeout(timer); timer = null; }
          startTimer();
        });
      });
    </script>

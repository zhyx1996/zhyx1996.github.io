<body>
    <div class="layout">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-mark">扶</span>

            <nav class="sidebar-nav">

        <main class="main">
            <section class="page-banner">
                <div>
                    <span class="eyebrow">Roguelike Classic</span>

                <div class="nethack-container">
                    <iframe class="nethack-iframe" src="https://www.alt.org/nethack/hterm/" title="NetHack 5.0 on nethack.alt.org" loading="lazy"></iframe>

        window.sakanaInstance = new SakanaWidget({ size: 120, character: 'chisato', draggable: false }).mount('#sakana-drag-widget');
      }

    <script async onload="initSakanaWidget()" src="https://cdn.jsdelivr.net/npm/sakana-widget@2.7.1/lib/sakana.min.js"></script>

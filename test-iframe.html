<!DOCTYPE html>
<html>
<head><title>Test NAO iframe</title></head>
<body>
<iframe id="nh-frame" src="https://www.alt.org/nethack/hterm/" width="900" height="700" style="border:1px solid #333;"></iframe>
<script>
const iframe = document.getElementById('nh-frame');
iframe.onload = function() { window.__loaded = true; };
iframe.onerror = function(e) { window.__error = e.message || 'load error'; };
setTimeout(() => {
  try { window.__accessible = !!iframe.contentDocument; } catch(e) { window.__accessible = false; window.__err = e.message; }
}, 10000);
</script>
</body>
</html>

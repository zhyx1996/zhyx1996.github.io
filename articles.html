<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客园文章 · 扶摇接海</title>
    <meta name="theme-color" content="#D97706">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23D97706'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'>扶</text></svg>">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakana-widget@2.7.1/lib/sakana.min.css" />
    <style>
        /* 防止 FOUC */
        body { opacity: 0; animation: fadeIn 0.5s ease 0.1s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-mark">扶</span>
                <span class="logo-text">扶摇接海</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="/index.html">首页</a>
                <a class="nav-item" href="/projects.html">仓库</a>
                <a class="nav-item" href="/stars.html">收藏</a>
                <a class="nav-item active" href="/articles.html">文章</a>
            </nav>
            <div class="sidebar-footer">
                <span class="sidebar-meta">@zhyx1996</span>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main">
            <section class="page-banner">
                <div>
                    <span class="eyebrow">Cnblogs articles</span>
                    <h1>博客园文章展示</h1>
                    <p>公开文章、最近随笔与内容摘要。</p>
                </div>
                <div class="page-stats">
                    <div class="stat-card">
                        <span class="stat-num">4</span>
                        <span class="stat-label">文章</span>
                    </div>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">全部文章</h2>
                <div class="article-list">
                <!-- 文章由 app.js 动态渲染 -->
            </div>
            </section>
        </main>
    </div>

    <!-- Sakana 拖拽小球 -->
    <div id="sakana-drag-widget"></div>

    <script src="/app.js?v=3"></script>
    <script>
      function initSakanaWidget() {
        new SakanaWidget({ size: 120, character: 'chisato' }).mount('#sakana-drag-widget');
      }
    </script>
    <script async onload="initSakanaWidget()" src="https://cdn.jsdelivr.net/npm/sakana-widget@2.7.1/lib/sakana.min.js"></script>
</body>
</html>

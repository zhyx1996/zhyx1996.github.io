    <script>
      (function() {
        var FALLBACK = 427;
        var CACHE_KEY = 'star_total_cache';
        var CACHE_TTL = 60 * 60 * 1000;
        var el = document.getElementById('star-total');
        var render = function(v) { if (el) el.textContent = v; };
        try {
          var cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
            var parsed = JSON.parse(cached);
            if (parsed && Date.now() - parsed.ts < CACHE_TTL) {
              render(parsed.value);
              return;
            }
          }
        } catch (_) {}
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, 8000);
        fetch('https://api.github.com/users/zhyx1996/starred?per_page=1', { headers: { 'Accept': 'application/vnd.github.v3+json' }, signal: controller.signal })
          .then(function(r) { clearTimeout(timer); return r; })
          .then(function(r) {
            var link = r.headers.get('link');
            var total = FALLBACK;
            if (link) {
              var m = link.match(/page=(\d+)>; rel="last"/);
              if (m) total = parseInt(m[1], 10);
            }
            render(total);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ value: total, ts: Date.now() })); } catch (_) {}
          })
          .catch(function() { render(FALLBACK); })
          .finally(function() { clearTimeout(timer); });
      })();
    </script>
    <script>
      function initSakanaWidget() {
        if (window.__sakanaWidgetInitialized) return;
        window.__sakanaWidgetInitialized = true;
        window.sakanaInstance = new SakanaWidget({ size: 120, character: 'chisato', draggable: false }).mount('#sakana-drag-widget');
      }
      function loadSakanaWithFallback() {
        var script = document.createElement('script');
        script.async = true;
        script.onload = function() { window.initSakanaWidget && window.initSakanaWidget(); };
        script.onerror = function() {
          var fallback = document.createElement('script');
          fallback.async = true;
          fallback.onload = function() { window.initSakanaWidget && window.initSakanaWidget(); };
          fallback.src = 'https://fastly.jsdelivr.net/npm/sakana-widget@2.7.1/lib/sakana.min.js';
          document.head.appendChild(fallback);
        };
        script.src = 'https://cdn.jsdelivr.net/npm/sakana-widget@2.7.1/lib/sakana.min.js';
        document.head.appendChild(script);
      }
      loadSakanaWithFallback();
    </script>
